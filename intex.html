<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Xỉu Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 10px;
            background-color: #0b0713; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center;
        }
        .app-container {
            width: 100%; max-width: 400px;
            background: #151022; border-radius: 16px;
            border: 1px solid #2a2040; padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        /* Khung Video Live */
        .video-box {
            position: relative; width: 100%; height: 180px;
            background: #000; border-radius: 12px; overflow: hidden;
            border: 1px solid #3d2c5e;
        }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .live-tag {
            position: absolute; top: 8px; right: 8px;
            background: #e60000; color: #fff; padding: 2px 6px;
            font-size: 10px; font-weight: bold; border-radius: 4px;
        }
        /* Thông tin số dư */
        .info-panel {
            display: flex; justify-content: space-between; align-items: center;
            background: #1f1833; padding: 10px; border-radius: 8px;
            margin: 10px 0; font-size: 13px; border: 1px solid #2e224d;
        }
        .balance-num { color: #ffcc00; font-weight: bold; }
        
        /* Cửa đặt cược Tài / Xỉu */
        .bet-choices {
            display: flex; gap: 10px; margin-bottom: 12px;
        }
        .bet-btn {
            flex: 1; padding: 14px; border-radius: 12px; border: none;
            font-size: 16px; font-weight: bold; cursor: pointer; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .bet-btn:active { transform: scale(0.96); }
        .btn-tai { background: linear-gradient(135deg, #332b4a, #221a36); color: #fff; border: 1px solid #4a3d70; }
        .btn-xiu { background: #fff; color: #111; }

        /* Chọn mức tiền cược */
        .money-section { background: #1a132b; padding: 10px; border-radius: 10px; border: 1px solid #2a2040; }
        .money-input-box {
            background: #110c1c; border: 1px solid #332652; border-radius: 8px;
            padding: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #ffcc00;
            margin-bottom: 8px;
        }
        .chip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .chip {
            background: #261d3d; border: 1px solid #423466; color: #fff;
            padding: 8px 0; border-radius: 6px; font-size: 12px; font-weight: bold;
            cursor: pointer; text-align: center;
        }
        .chip.active { background: #ffcc00; color: #000; border-color: #ffaa00; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Khung Video Giả lập Live -->
        <div class="video-box">
            <video autoplay muted loop playsinline>
                <!-- Thay link video ngắn quay cảnh lắc xí ngầu vào đây -->
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
            <div class="live-tag">● LIVE</div>
        </div>

        <!-- Số dư -->
        <div class="info-panel">
            <span>Số dư tài khoản:</span>
            <span class="balance-num" id="userBalance">1,000,000 đ</span>
        </div>

        <!-- Nút Cược Tài / Xỉu -->
        <div class="bet-choices">
            <button class="bet-btn btn-tai" onclick="placeBet('TÀI')">TÀI<br><span style="font-size:11px; color:#aaa;">0 đ</span></button>
            <button class="bet-btn btn-xiu" onclick="placeBet('XỈU')">XỈU<br><span style="font-size:11px; color:#666;">0 đ</span></button>
        </div>

        <!-- Bảng chọn tiền cược -->
        <div class="money-section">
            <div style="font-size: 11px; color: #8a7cafff; margin-bottom: 4px;">SỐ TIỀN CƯỢC</div>
            <div class="money-input-box" id="currentBetAmount">10,000</div>
            <div class="chip-grid">
                <div class="chip" onclick="setChip(1000, this)">1k</div>
                <div class="chip" onclick="setChip(5000, this)">5k</div>
                <div class="chip active" onclick="setChip(10000, this)">10k</div>
                <div class="chip" onclick="setChip(50000, this)">50k</div>
                <div class="chip" onclick="setChip(100000, this)">100k</div>
                <div class="chip" onclick="setChip(500k, this)">500k</div>
                <div class="chip" onclick="setChip(1000000, this)">1M</div>
                <div class="chip" onclick="setChip(5000000, this)">5M</div>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo Telegram WebApp SDK
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000000;
        let selectedMoney = 10000;

        function setChip(amount, element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            selectedMoney = amount;
            document.getElementById('currentBetAmount').innerText = amount.toLocaleString();
        }

        function placeBet(type) {
            if (balance < selectedMoney) {
                alert("Số dư không đủ để đặt cược!");
                return;
            }
            balance -= selectedMoney;
            document.getElementById('userBalance').innerText = balance.toLocaleString() + " đ";
            alert(`Bạn đã đặt ${selectedMoney.toLocaleString()} đ vào cửa ${type} thành công!`);
        }
    </script>
</body>
</html>
