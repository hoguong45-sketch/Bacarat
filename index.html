<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIT88 - GAME</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 10px;
            background-color: #0c0914; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center;
        }
        .app-container {
            width: 100%; max-width: 400px;
            background: #151022; border-radius: 16px;
            border: 1px string #2c204a; padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        /* Header Title */
        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            background: #1c152e; padding: 8px 12px; border-radius: 10px;
            margin-bottom: 10px; font-size: 14px; font-weight: bold; border: 1px solid #2e214d;
        }
        .app-header span { color: #facc15; }

        /* Khung Video Live */
        .video-box {
            position: relative; width: 100%; height: 180px;
            background: #000; border-radius: 12px; overflow: hidden;
            border: 1px solid #3d2c5e; margin-bottom: 10px;
        }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .live-tag {
            position: absolute; top: 8px; right: 8px;
            background: rgba(220, 38, 38, 0.9); color: #fff; padding: 2px 8px;
            font-size: 10px; font-weight: bold; border-radius: 4px; display: flex; align-items: center; gap: 4px;
        }
        .live-tag::before {
            content: ''; width: 6px; height: 6px; background: #fff; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Panel thông tin phụ và nút menu nhỏ */
        .sub-panel {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px; font-size: 12px; color: #a78bfa;
        }
        .mini-tools { display: flex; gap: 6px; }
        .tool-btn {
            background: #1c152e; border: 1px solid #352659; border-radius: 6px;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: #fff; cursor: pointer;
        }
        .result-badge {
            background: #1c152e; border: 1px solid #352659; border-radius: 20px;
            padding: 6px 12px; font-weight: bold; color: #fff; font-size: 13px;
        }
        .result-badge span { color: #f87171; }

        /* Thông tin số dư */
        .info-panel {
            display: flex; justify-content: space-between; align-items: center;
            background: #1c152e; padding: 10px 12px; border-radius: 10px;
            margin-bottom: 10px; font-size: 13px; border: 1px solid #2e214d;
        }
        .balance-num { color: #facc15; font-weight: bold; }

        /* Thanh lịch sử chấm tròn */
        .history-bar {
            background: #1c152e; padding: 8px; border-radius: 10px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; border: 1px solid #2e214d; overflow-x: auto;
        }
        .dot {
            width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0;
        }
        .dot.black { background: #332b4a; border: 1px solid #6b5a99; }
        .dot.white { background: #e2e8f0; }

        /* Cửa đặt cược Tài / Xỉu */
        .bet-choices {
            display: flex; gap: 10px; margin-bottom: 12px;
        }
        .bet-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            cursor: pointer; text-align: left; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .bet-btn:active { transform: scale(0.96); }
        .btn-tai { background: #1c152e; border: 1px solid #352659; color: #fff; }
        .btn-xiu { background: #fff; color: #0f0b1a; border: 1px solid #e2e8f0; }
        
        .bet-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; display: block; margin-bottom: 4px; }
        .bet-sub { font-size: 11px; opacity: 0.8; display: flex; align-items: center; gap: 4px; }

        /* Bảng chọn tiền cược */
        .money-section { background: #1c152e; padding: 12px; border-radius: 12px; border: 1px solid #2e214d; }
        .money-label { font-size: 11px; color: #8a7cafff; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .money-input-box {
            background: #130e21; border: 1px solid #352659; border-radius: 8px;
            padding: 10px; text-align: right; font-size: 20px; font-weight: bold; color: #facc15;
            margin-bottom: 10px;
        }
        .chip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .chip {
            background: #271f3d; border: 1px solid #433369; color: #fff;
            padding: 8px 0; border-radius: 6px; font-size: 12px; font-weight: bold;
            cursor: pointer; text-align: center; transition: 0.2s;
        }
        .chip.active { background: #facc15; color: #000; border-color: #f59e0b; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <span>HIT88 - GAME 🎮</span>
        </div>

        <!-- Khung Video Live -->
        <div class="video-box">
            <video autoplay muted loop playsinline>
                <!-- Thay link video hoặc luồng stream trực tiếp vào đây -->
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
            <div class="live-tag">LIVE</div>
        </div>

        <!-- Sub Panel (Mã phiên & Nút công cụ) -->
        <div class="sub-panel">
            <span>#874063</span>
            <div class="mini-tools">
                <div class="tool-btn">📊</div>
                <div class="tool-btn">⚙️</div>
                <div class="tool-btn">❓</div>
            </div>
            <div class="result-badge">XỈU (8) 🎯</div>
        </div>

        <!-- Số dư -->
        <div class="info-panel">
            <span>Số dư: <span class="balance-num" id="userBalance">0 đ</span></span>
            <span style="font-size: 11px; color: #94a3b8;">⏱ 0 s</span>
        </div>

        <!-- Thanh lịch sử chấm tròn -->
        <div class="history-bar">
            <div class="dot black"></div>
            <div class="dot white"></div>
            <div class="dot black"></div>
            <div class="dot black"></div>
            <div class="dot white"></div>
            <div class="dot black"></div>
            <div class="dot white"></div>
            <div class="dot white"></div>
            <div class="dot black"></div>
            <div class="dot white"></div>
        </div>

        <!-- Nút Cược Tài / Xỉu -->
        <div class="bet-choices">
            <button class="bet-btn btn-tai" onclick="placeBet('TÀI')">
                <span class="bet-title">TÀI</span>
                <span class="bet-sub">📥 144.232.923 &nbsp; 👤 0</span>
            </button>
            <button class="bet-btn btn-xiu" onclick="placeBet('XỈU')">
                <span class="bet-title" style="color: #0f0b1a;">XỈU</span>
                <span class="bet-sub" style="color: #475569;">📥 103.266.272 &nbsp; 👤 0</span>
            </button>
        </div>

        <!-- Bảng chọn tiền cược -->
        <div class="money-section">
            <div class="money-label">
                <span>SỐ TIỀN</span>
                <span>10.000</span>
            </div>
            <div class="money-input-box" id="currentBetAmount">10.000</div>
            <div class="chip-grid">
                <div class="chip" onclick="setChip(1000, this)">1k</div>
                <div class="chip" onclick="setChip(5000, this)">5k</div>
                <div class="chip active" onclick="setChip(10000, this)">10k</div>
                <div class="chip" onclick="setChip(50000, this)">50k</div>
                <div class="chip" onclick="setChip(100000, this)">100k</div>
                <div class="chip" onclick="setChip(500000, this)">500k</div>
                <div class="chip" onclick="setChip(1000000, this)">1M</div>
                <div class="chip" onclick="setChip(5000000, this)">5M</div>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo Telegram WebApp SDK
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000000; // Số dư mẫu khởi tạo
        let selectedMoney = 10000;

        document.getElementById('userBalance').innerText = balance.toLocaleString() + " đ";

        function setChip(amount, element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            selectedMoney = amount;
            document.getElementById('currentBetAmount').innerText = amount.toLocaleString();
        }

        function placeBet(type) {
            if (balance < selectedMoney) {
                alert("Số dư không đủ để đặt cược!");
                return;
            }
            balance -= selectedMoney;
            document.getElementById('userBalance').innerText = balance.toLocaleString() + " đ";
            alert(`Bạn đã đặt ${selectedMoney.toLocaleString()} đ vào cửa ${type} thành công[span_0](start_span)[span_0](end_span)!`);
        }
    </script>
</body>
</html>
